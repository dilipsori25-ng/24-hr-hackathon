<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        #container {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgb(104, 156, 224);
              padding: 50px;
            border-radius: 10px;
             margin: 200px;
        }

        #select{
        

        }

        body {
            background-color: rgba(216, 185, 127, 0.274);
        }
 
  
      @media (max-width: 600px) {
        body {
            font-size: 14px;
        }
         
    }
    
    #formValidate input{
      padding : 10px
    }
    </style>
</head>

  
<body>
    
   
         
    
    <div id="container">
        <form id="formValidate">
            <p>user name</p>
            <input type="text"  id="fname">



            <p>Email id </p>
            <input type="text" id="mail">


            <p>password</p>
            <input type="password" id="pass">

            <p>select country</p>
            <select name="country" id="select">
                <option value="1" disabled>choose</option>
                <option value="2">USA</option>
                <option value="3">INDIA</option>
                <option value="4">UAE</option>
                <option value="5">JAPAN</option>
            </select>
            <br>
            <br>

            <p><input type="submit" value="submit"></p>


            <div class="resul">

            </div>

        </form>
    </div>

    <script>
        let form = document.getElementById("formValidate");
        form.onsubmit = function () {
            let arr = [];
            arr[0] = document.getElementById("fname").value
            arr[1] = document.getElementById("mail").value
            arr[2] = document.getElementById("pass").value
            arr[3] = document.getElementById("select").value


            if (arr[0] == "dilip") {
                if (arr[2] == 123456 && arr[1] == "soridilip@gmail.com") {
                    alert("successful");
                    localStorage.setItem("username", arr[0])
                    localStorage.setItem("mail", arr[1])
                    localStorage.setItem("pass", arr[2])
                    localStorage.setItem("select", arr[3])

                }
                else {
                    alert("required name")
                    localStorage.setItem("value", arr[0])

                }

            } else {
                alert("invalid user name or password")
            }
        }


    </script>
</body>

</html>
